<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">一項需求如何在 Temple 裡完成交付</title>
  <desc id="desc">團隊先確認這次要達成什麼、做到哪裡，再依序設計、實作、測試、評估與獨立查驗，最後確認是否具備發布條件。每個階段的決定與驗證結果都會留在版本庫裡。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow-fill" d="M0 0 10 5 0 10Z"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Segoe UI", sans-serif; }
    .canvas { fill: #ffffff; } .lane { fill: #f6f8fa; stroke: #d0d7de; } .direction { fill: #eef5ff; stroke: #7aa7df; } .delivery { fill: #e9f5f3; stroke: #4a9b92; } .assurance { fill: #fff7e6; stroke: #c8912e; } .rail { fill: #f6f8fa; stroke: #8c959f; }
    .ink { fill: #1f2328; } .muted { fill: #59636e; } .blue { fill: #245b99; } .teal { fill: #0f766e; } .amber { fill: #8a5a00; } .flow { fill: none; stroke: #59636e; } .arrow-fill { fill: #59636e; }
    @media (prefers-color-scheme: dark) { .canvas { fill: #0d1117; } .lane { fill: #161b22; stroke: #30363d; } .direction { fill: #15263d; stroke: #416b9f; } .delivery { fill: #102d2c; stroke: #2a7770; } .assurance { fill: #342b17; stroke: #9a701f; } .rail { fill: #161b22; stroke: #6e7681; } .ink { fill: #f0f6fc; } .muted { fill: #9da7b3; } .blue { fill: #79b8ff; } .teal { fill: #5eead4; } .amber { fill: #f2cc60; } .flow { stroke: #9da7b3; } .arrow-fill { fill: #9da7b3; } }
    @media (max-width: 520px) { .node .ink { font-size: 19px; } .node .muted { display: none; } .node circle, .node > text:not(.muted) { transform: translateY(10px); } .node.compact .ink { font-size: 17px; } text.blue, text.teal, text.amber { font-size: 12px; } }
  </style>
  <rect class="canvas" width="760" height="460" rx="12"/>
  <text class="muted" x="24" y="28" font-size="13" font-weight="700" letter-spacing="1.5">ONE REQUEST · EVIDENCE-GATED DELIVERY</text>
  <text class="ink" x="24" y="52" font-size="16" font-weight="650">每個階段都要有足夠的驗證紀錄，Work Item 才能進入下一階段。</text>

  <rect class="lane" x="18" y="68" width="724" height="88" rx="8"/><text class="blue" x="36" y="94" font-size="12" font-weight="750" letter-spacing="1">需求與授權</text>
  <g class="node"><rect class="direction" x="190" y="82" width="214" height="60" rx="7" stroke-width="1.5"/><circle class="blue" cx="214" cy="102" r="14"/><text x="214" y="107" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="750">1</text><text class="ink" x="238" y="107" font-size="17" font-weight="700">確認要解決的問題</text><text class="muted" x="238" y="128" font-size="12">確認產品方向</text></g>
  <path class="flow" d="M404 112H432" stroke-width="2" marker-end="url(#arrow)"/>
  <g class="node"><rect class="direction" x="438" y="82" width="214" height="60" rx="7" stroke-width="1.5"/><circle class="blue" cx="462" cy="102" r="14"/><text x="462" y="107" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="750">2</text><text class="ink" x="486" y="107" font-size="17" font-weight="700">確認這次做到哪裡</text><text class="muted" x="486" y="128" font-size="12">保留人類決定權</text></g>

  <path class="flow" d="M380 156V164" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="lane" x="18" y="170" width="724" height="88" rx="8"/><text class="teal" x="36" y="196" font-size="12" font-weight="750" letter-spacing="1">設計與實作</text>
  <g class="node"><rect class="delivery" x="190" y="184" width="214" height="60" rx="7" stroke-width="1.5"/><circle class="teal" cx="214" cy="204" r="14"/><text x="214" y="209" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="750">3</text><text class="ink" x="238" y="209" font-size="17" font-weight="700">決定怎麼做</text><text class="muted" x="238" y="230" font-size="12">方案、介面與規則</text></g>
  <path class="flow" d="M404 214H432" stroke-width="2" marker-end="url(#arrow)"/>
  <g class="node"><rect class="delivery" x="438" y="184" width="214" height="60" rx="7" stroke-width="1.5"/><circle class="teal" cx="462" cy="204" r="14"/><text x="462" y="209" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="750">4</text><text class="ink" x="486" y="209" font-size="17" font-weight="700">完成程式變更</text><text class="muted" x="486" y="230" font-size="12">程式碼與相關文件</text></g>

  <path class="flow" d="M380 258V266" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="lane" x="18" y="272" width="724" height="98" rx="8"/><text class="amber" x="36" y="298" font-size="12" font-weight="750" letter-spacing="1">驗證與查核</text>
  <g class="node compact"><rect class="assurance" x="148" y="286" width="170" height="70" rx="7" stroke-width="1.5"/><circle class="amber" cx="172" cy="311" r="14"/><text x="172" y="316" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="750">5</text><text class="ink" x="196" y="316" font-size="16" font-weight="700">測試與評估</text><text class="muted" x="196" y="337" font-size="12">對照驗收條件</text></g>
  <path class="flow" d="M318 321H334" stroke-width="2" marker-end="url(#arrow)"/>
  <g class="node compact"><rect class="assurance" x="340" y="286" width="170" height="70" rx="7" stroke-width="1.5"/><circle class="amber" cx="364" cy="311" r="14"/><text x="364" y="316" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="750">6</text><text class="ink" x="388" y="316" font-size="16" font-weight="700">獨立 QA</text><text class="muted" x="388" y="337" font-size="12">由另一個身分查驗</text></g>
  <path class="flow" d="M510 321H526" stroke-width="2" marker-end="url(#arrow)"/>
  <g class="node compact"><rect class="assurance" x="532" y="286" width="190" height="70" rx="7" stroke-width="1.5"/><circle class="amber" cx="556" cy="311" r="14"/><text x="556" y="316" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="750">7</text><text class="ink" x="580" y="316" font-size="16" font-weight="700">發布前確認</text><text class="muted" x="580" y="337" font-size="12">確認是否具備發布條件</text></g>

  <rect class="rail" x="18" y="390" width="724" height="52" rx="8" stroke-width="1.5"/><text class="muted" x="36" y="412" font-size="11" font-weight="750" letter-spacing="1">版本庫留下可追溯的紀錄</text><text class="ink" x="36" y="431" font-size="13" font-weight="650">工作範圍 · 決策 · 規格 · 版本 · 測試 · 評估 · QA · 核准</text>
  <path class="flow" d="M380 370V384" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
