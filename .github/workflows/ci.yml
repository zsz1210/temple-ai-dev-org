name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - id: scope
        name: Select verification scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-scope.mjs
      - id: install
        name: Install pinned dependencies
        if: ${{ always() }}
        run: npm ci --ignore-scripts
      - id: governance
        name: Governance — repository and documentation checks
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run check
      - id: schema
        name: Governance — schema validation
        if: ${{ always() && steps.install.outcome == 'success' && steps.scope.outputs.scope != 'documentation-only' }}
        run: node ./templew.mjs schema validate . --json
      - id: doctor
        name: Governance — Doctor
        if: ${{ always() && steps.install.outcome == 'success' && steps.scope.outputs.scope != 'documentation-only' }}
        run: node ./templew.mjs doctor . --json
      - id: behavior_evidence
        name: Behavior — evidence/state contracts
        if: ${{ always() && steps.install.outcome == 'success' && steps.scope.outputs.scope == 'evidence-state-only' }}
        run: |
          result=0
          npm run test:fast || result=$?
          node --test test/evidence-observer.test.mjs || result=$?
          node --test --test-name-pattern="init, doctor, status, and idempotent re-init succeed" test/cli.test.mjs || result=$?
          exit "$result"
      - id: behavior_full
        name: Behavior — full test suite
        if: ${{ always() && steps.install.outcome == 'success' && (steps.scope.outputs.scope == 'full' || steps.scope.outcome != 'success') }}
        run: npm run test:full
      - id: browser_console
        name: Browser — Management Console
        if: ${{ always() && steps.install.outcome == 'success' && (steps.scope.outputs.scope == 'full' || steps.scope.outcome != 'success') && matrix.node-version == 24 }}
        run: npm run test:browser
      - id: behavior_documentation
        name: Behavior — documentation-only result
        if: ${{ always() && steps.scope.outputs.scope == 'documentation-only' }}
        run: echo "Behavioral tests are not required for the strict documentation-only scope."
      - name: Report verification lanes
        if: ${{ always() }}
        env:
          SCOPE: ${{ steps.scope.outputs.scope || 'full' }}
          SCOPE_REASON: ${{ steps.scope.outputs.reason || 'scope selection failed; full verification required' }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          GOVERNANCE_OUTCOME: ${{ steps.governance.outcome }}
          SCHEMA_OUTCOME: ${{ steps.schema.outcome }}
          DOCTOR_OUTCOME: ${{ steps.doctor.outcome }}
          EVIDENCE_BEHAVIOR_OUTCOME: ${{ steps.behavior_evidence.outcome }}
          FULL_BEHAVIOR_OUTCOME: ${{ steps.behavior_full.outcome }}
          BROWSER_CONSOLE_OUTCOME: ${{ steps.browser_console.outcome }}
          DOCUMENTATION_BEHAVIOR_OUTCOME: ${{ steps.behavior_documentation.outcome }}
        run: |
          case "$SCOPE" in
            documentation-only) behavior_outcome="$DOCUMENTATION_BEHAVIOR_OUTCOME" ;;
            evidence-state-only) behavior_outcome="$EVIDENCE_BEHAVIOR_OUTCOME" ;;
            *) behavior_outcome="$FULL_BEHAVIOR_OUTCOME" ;;
          esac
          {
            echo "### CI verification"
            echo
            echo "- Scope: \`$SCOPE\`"
            echo "- Scope reason: $SCOPE_REASON"
            echo "- Scope selection: \`$SCOPE_OUTCOME\`"
            echo "- Dependency install: \`$INSTALL_OUTCOME\`"
            echo "- Governance / repository checks: \`$GOVERNANCE_OUTCOME\`"
            echo "- Governance / schema: \`$SCHEMA_OUTCOME\`"
            echo "- Governance / Doctor: \`$DOCTOR_OUTCOME\`"
            echo "- Behavioral lane: \`$behavior_outcome\`"
            echo "- Management Console browser: \`$BROWSER_CONSOLE_OUTCOME\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce aggregated verification result
        if: ${{ always() }}
        env:
          SCOPE: ${{ steps.scope.outputs.scope || 'full' }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          GOVERNANCE_OUTCOME: ${{ steps.governance.outcome }}
          SCHEMA_OUTCOME: ${{ steps.schema.outcome }}
          DOCTOR_OUTCOME: ${{ steps.doctor.outcome }}
          EVIDENCE_BEHAVIOR_OUTCOME: ${{ steps.behavior_evidence.outcome }}
          FULL_BEHAVIOR_OUTCOME: ${{ steps.behavior_full.outcome }}
          BROWSER_CONSOLE_OUTCOME: ${{ steps.browser_console.outcome }}
          DOCUMENTATION_BEHAVIOR_OUTCOME: ${{ steps.behavior_documentation.outcome }}
          NODE_VERSION: ${{ matrix.node-version }}
        run: |
          failed=0
          require_success() {
            if [ "$2" != "success" ]; then
              echo "$1 failed or did not run: $2"
              failed=1
            fi
          }
          require_success "Scope selection" "$SCOPE_OUTCOME"
          require_success "Dependency install" "$INSTALL_OUTCOME"
          require_success "Governance repository checks" "$GOVERNANCE_OUTCOME"
          case "$SCOPE" in
            documentation-only) require_success "Documentation-only behavioral result" "$DOCUMENTATION_BEHAVIOR_OUTCOME" ;;
            evidence-state-only)
              require_success "Governance schema validation" "$SCHEMA_OUTCOME"
              require_success "Governance Doctor" "$DOCTOR_OUTCOME"
              require_success "Evidence/state behavioral lane" "$EVIDENCE_BEHAVIOR_OUTCOME"
              ;;
            full)
              require_success "Governance schema validation" "$SCHEMA_OUTCOME"
              require_success "Governance Doctor" "$DOCTOR_OUTCOME"
              require_success "Full behavioral lane" "$FULL_BEHAVIOR_OUTCOME"
              if [ "$NODE_VERSION" = "24" ]; then
                require_success "Management Console browser gate" "$BROWSER_CONSOLE_OUTCOME"
              fi
              ;;
            *) echo "Unknown verification scope: $SCOPE"; failed=1 ;;
          esac
          exit "$failed"
